<!doctype html>

  <body>
    <!-- Vertical b-roll reel for coach-perche: pdf1, pdf2, squat (slow tempo), bench, gym -->

    <script>
      window.__timelines = window.__timelines || {};
      const W = 1080, H = 1920;
      const mk = (id, alpha) => { const r = new THREE.WebGLRenderer({ canvas: document.getElementById(id), antialias: true, alpha, preserveDrawingBuffer: true });

      const rBg = mk("bg", false), rFg = mk("fg", true);

        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.userData.canvas = c; return t; };
      let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const ss = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      const lerp = (a, b, p) => a + (b - a) * p;

      // ---------- LB System mark (red lattice) — redrawn from Luca's logo ----------
      function drawMark(g, x, y, w, col, gap, lw) {

      }

        g.fillStyle = "#141417"; g.fillRect(0, 0, w, h);

        g.fillStyle = "#f2f2f2"; g.font = "italic 900 118px Inter, sans-serif"; g.textBaseline = "middle"; g.fillText("LB", 240, 196);
        g.font = "800 44px Inter, sans-serif"; g.fillStyle = "#bdbdbd"; g.fillText("SYSTEM", 196, 300);
      });

      // ---------- rigged voxel character ----------
      function makeRig(parent, o) {
        const R = {}; const skin = M(o.skin), skinD = M(o.skinD), hair = M(o.hair), shirt = M(o.shirt), pants = M(o.pants), shoe = M(o.shoe || 0xe9e9e9), dark = M(0x140f12), white = M(0xffffff);

        const leg = (s) => { const hip = new THREE.Group(); hip.position.set(s * 0.12, -0.06, 0); pelvis.add(hip);
          box(0.2, 0.46, 0.22, pants, 0, -0.22, 0, hip);
          const knee = new THREE.Group(); knee.position.y = -0.44; hip.add(knee);
          box(0.17, 0.46, 0.18, pants, 0, -0.22, 0, knee);

          box(0.18, 0.34, 0.19, shirt, 0, -0.13, 0, sh); box(0.165, 0.12, 0.175, skin, 0, -0.26, 0, sh);
          const el = new THREE.Group(); el.position.y = -0.3; sh.add(el);
          box(0.155, 0.3, 0.165, skin, 0, -0.14, 0, el);
          const hand = new THREE.Group(); hand.position.y = -0.3; el.add(hand);

        const eye = (x) => { box(0.09, 0.065, 0.02, white, x, 0.045, 0.205, head); return box(0.045, 0.06, 0.02, dark, x + (x < 0 ? 0.015 : -0.015), 0.045, 0.213, head); };

          [-0.1, 0.1].forEach((x) => box(0.1, 0.065, 0.021, new THREE.MeshStandardMaterial({ color: 0xcfe8ff, transparent: true, opacity: 0.35, roughness: 0.1 }), x, 0.045, 0.235, head)); }

        box(0.06, 0.2, 0.38, hair, -0.215, 0.14, -0.02, head); box(0.06, 0.2, 0.38, hair, 0.215, 0.14, -0.02, head); box(0.44, 0.28, 0.06, hair, 0, 0.1, -0.205, head);

      }
      // pose helpers (character faces +z; positive rx swings a hanging limb backwards, raises the torso forward)
      function legPose(leg, a, s, ankleExtra) { leg.hip.rotation.set(-a, 0, 0); leg.knee.rotation.set(a + s, 0, 0); leg.ank.rotation.set(-s + (ankleExtra || 0), 0, 0); }
      function standOn(R, a, s, footY) { R.pelvis.position.set(0, (footY || 0) + 0.1 + 0.06 + 0.44 * (Math.cos(a) + Math.cos(s)), -0.44 * (Math.sin(a) - Math.sin(s))); }
      function relax(R) { R.armL.sh.rotation.set(0.05, 0, -0.08); R.armR.sh.rotation.set(0.05, 0, 0.08); R.armL.el.rotation.set(-0.12, 0, 0); R.armR.el.rotation.set(-0.12, 0, 0);
        R.spine.rotation.set(0, 0, 0); R.head.rotation.set(0, 0, 0); R.armL.hand.rotation.set(0, 0, 0); R.armR.hand.rotation.set(0, 0, 0); }
      function blink(R, t, ph, closed) { const bt = (t + (ph || 0)) % 3.9; const b = closed ? 1 : (bt < 0.13 ? Math.sin(bt / 0.13 * Math.PI) : 0); R.lidL.scale.y = R.lidR.scale.y = 0.01 + 0.99 * b; R.lashL.visible = R.lashR.visible = !!closed; }
      function breathe(R, t, k) { R.torso.scale.set(1, 1 + Math.sin(t * 2.2) * 0.012 * (k || 1), 1 + Math.sin(t * 2.2) * 0.02 * (k || 1)); }
      const wp = (o) => { const v = new THREE.Vector3(); o.getWorldPosition(v); return v; };

      const LUCA = { skin: 0xd9a27c, skinD: 0xc08664, hair: 0x3d2817, beard: 0x35210f, shirt: 0x141417, pants: 0x232328, chest: teeTex, shoe: 0xe9e9e9 };
      const PHYSIO = { skin: 0xf0c7a4, skinD: 0xd8ab88, hair: 0x6b4a2b, shirt: 0xf4f6f8, pants: 0x1f3a5f, collar: 0xdfe3e8, glasses: true, shortHair: true, shoe: 0xffffff };

      // ---------- environments (bg = blurred set, fg = sharp hero props) ----------
      const ENV = {};
      function env(name) { const bg = new THREE.Group(), fg = new THREE.Group(); sceneBg.add(bg); sceneFg.add(fg); return (ENV[name] = { bg, fg }); }
      function lightRig(grp, o) {
        grp.add(new THREE.HemisphereLight(o.sky, o.ground, o.hemi));
        const k = new THREE.DirectionalLight(o.key, o.keyI); k.position.set(...o.keyP); grp.add(k);
        if (o.rim) { const r = new THREE.DirectionalLight(o.rim, o.rimI); r.position.set(...o.rimP); grp.add(r); }
        (o.points || []).forEach(([c, i, d, p]) => { const l = new THREE.PointLight(c, i, d, 2); l.position.set(...p); grp.add(l); });
      }
      const steel = MM(0x1d1e22, 0.55, 0.5), chrome = MM(0xc9cdd4, 0.25, 0.9), rubber = M(0x111113), redM = M(0xb91f1a), redGlow = M(0xff2a20, 0xff2a20, 2.2);

      // GYM (NEXUS)
      const GYM = env("gym");
      const floorTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#1c1c20"; g.fillRect(0, 0, w, h); g.strokeStyle = "#121215"; g.lineWidth = 5;
        for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 128); g.lineTo(w, i * 128); g.stroke(); }
        for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(255,255,255,${0.02 + rnd() * 0.03})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); } });
      floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(12, 12);
      const gymFloor = (grp) => { const f = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 })); f.rotation.x = -Math.PI / 2; grp.add(f); };
      gymFloor(GYM.bg);
      const wallTex = canvasTex(512, 256, (g, w, h) => { g.fillStyle = "#26262b"; g.fillRect(0, 0, w, h); for (let i = 0; i < 1400; i++) { const c = 30 + rnd() * 18; g.fillStyle = `rgb(${c},${c},${c + 4})`; g.fillRect(rnd() * w, rnd() * h, 3, 3); } });
      wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(4, 1);
      const wallM = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95 });
      box(34, 8, 0.3, wallM, 0, 4, -7.2, GYM.bg); box(0.3, 8, 24, wallM, -8, 4, 0, GYM.bg); box(0.3, 8, 24, wallM, 8, 4, 0, GYM.bg);
      box(34, 0.3, 24, M(0x111114), 0, 6.4, 0, GYM.bg);
      for (let i = -3; i <= 3; i++) { box(0.08, 5.6, 0.06, redGlow, i * 2.3 + (i === 0 ? 99 : 0), 3.2, -7.0, GYM.bg); }
      for (let i = 0; i < 4; i++) box(5.5, 0.08, 0.5, M(0xffffff, 0xffffff, 1.6), 0, 6.2, -5 + i * 3.2, GYM.bg);
      // NEXUS sign (texture built lazily once the logo image has loaded)
      const nexusMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveIntensity: 0.0, transparent: true, roughness: 0.6 });
      const nexusSign = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 1.9), nexusMat); nexusSign.position.set(0, 3.6, -7.0); GYM.bg.add(nexusSign);
      box(6.0, 2.4, 0.06, M(0x0b0b0d), 0, 3.6, -7.04, GYM.bg);
      { const N = window.NEXUS_RGBA, raw = atob(N.d), px = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) px[i] = raw.charCodeAt(i);
        const t = new THREE.DataTexture(px, N.w, N.h, THREE.RGBAFormat); t.flipY = true; t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
        nexusMat.map = t; nexusMat.emissiveMap = t; nexusMat.color.set(0xffffff); nexusMat.emissiveIntensity = 0.9; nexusMat.alphaTest = 0.05; }
      const ensureNexus = () => {};
      // racks, dumbbells, plates
      const rack = (grp, x, z) => { [[-0.6, -0.5], [-0.6, 0.5], [0.6, -0.5], [0.6, 0.5]].forEach(([dx, dz]) => box(0.12, 2.6, 0.12, steel, x + dx, 1.3, z + dz, grp));
        box(1.32, 0.1, 0.1, steel, x, 2.6, z - 0.5, grp); box(1.32, 0.1, 0.1, steel, x, 2.6, z + 0.5, grp); box(0.1, 0.1, 1.1, steel, x - 0.6, 2.6, z, grp); box(0.1, 0.1, 1.1, steel, x + 0.6, 2.6, z, grp); };
      rack(GYM.bg, -4.6, -5.2); rack(GYM.bg, 4.6, -5.2); rack(GYM.bg, -6.5, -1.5);
      const plateM = M(0x0e0e10), plateRim = M(0xb91f1a);
      function barbell(grp, len, plates) { const g = new THREE.Group(); grp.add(g);
        const b = cyl(0.022, len, chrome, 0, 0, 0, g, 12); b.rotation.z = Math.PI / 2;
        [-1, 1].forEach((s) => { cyl(0.04, 0.05, chrome, s * (len / 2 - 0.42), 0, 0, g, 12).rotation.z = Math.PI / 2;
          for (let i = 0; i < plates; i++) { const p = cyl(0.225 - i * 0.03, 0.045, i === 0 ? plateRim : plateM, s * (len / 2 - 0.36 + i * 0.05), 0, 0, g, 28); p.rotation.z = Math.PI / 2; }
          const p2 = cyl(0.12, 0.048, plateM, s * (len / 2 - 0.36 + plates * 0.05 - 0.01), 0, 0, g, 20); p2.rotation.z = Math.PI / 2; });
        return g; }
      [[-4.6, -5.2], [4.6, -5.2]].forEach(([x, z]) => { const b = barbell(GYM.bg, 2.2, 2); b.position.set(x, 1.5, z - 0.5); });
      for (let i = 0; i < 8; i++) { const x = -3 + i * 0.75; box(0.5, 0.12, 0.12, chrome, x, 0.9, -6.6, GYM.bg); box(0.1, 0.24, 0.24, rubber, x - 0.24, 0.9, -6.6, GYM.bg); box(0.1, 0.24, 0.24, rubber, x + 0.24, 0.9, -6.6, GYM.bg); }
      box(6.4, 0.1, 0.6, steel, 0, 0.75, -6.6, GYM.bg); box(6.4, 0.1, 0.6, steel, 0, 0.35, -6.6, GYM.bg);
      for (let i = 0; i < 5; i++) { const p = cyl(0.42 - i * 0.04, 0.07, i % 2 ? plateM : plateRim, 6.6, 0.04 + i * 0.075, -3.5, GYM.bg, 28); }
      box(0.05, 2.4, 8, MM(0x8a93a3, 0.15, 0.7), 7.82, 1.7, -1.5, GYM.bg);
      lightRig(GYM.bg, { sky: 0xffeedd, ground: 0x18161c, hemi: 0.85, key: 0xffe0bd, keyI: 2.1, keyP: [3, 6, 4], rim: 0xff4a3a, rimI: 0.9, rimP: [-4, 3, -5] });
      lightRig(GYM.fg, { sky: 0xffeedd, ground: 0x18161c, hemi: 0.95, key: 0xffe0bd, keyI: 2.6, keyP: [3, 6, 4], rim: 0xff5a48, rimI: 1.5, rimP: [-4, 3, -4] });

      const heroBar = barbell(GYM.fg, 2.2, 2);
      const benchG = new THREE.Group(); GYM.fg.add(benchG);
      box(0.36, 0.1, 1.25, M(0x1a1a1d), 0, 0.42, 0, benchG); box(0.37, 0.02, 1.26, redM, 0, 0.365, 0, benchG);
      box(0.08, 0.36, 0.08, steel, 0, 0.18, -0.48, benchG); box(0.08, 0.36, 0.08, steel, 0, 0.18, 0.48, benchG); box(0.5, 0.05, 0.08, steel, 0, 0.025, -0.48, benchG); box(0.5, 0.05, 0.08, steel, 0, 0.025, 0.48, benchG);
      const benchUp = new THREE.Group(); GYM.fg.add(benchUp);                            // uprights for bench press
      [-0.62, 0.62].forEach((x) => { box(0.08, 1.15, 0.08, steel, x, 0.575, 0, benchUp); box(0.12, 0.05, 0.1, steel, x, 1.08, 0.04, benchUp); });
      const towel = new THREE.Group(); GYM.fg.add(towel);
      const lucaGym = makeRig(GYM.fg, LUCA);

      // BEDROOM
      const BED = env("bed");
      { const f = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), M(0x2a2420)); f.rotation.x = -Math.PI / 2; BED.bg.add(f);
        box(20, 6, 0.2, M(0x1d2433), 0, 3, -3.2, BED.bg); box(0.2, 6, 20, M(0x1a2030), -4.5, 3, 0, BED.bg);
        box(1.6, 1.8, 0.05, M(0x7da0ff, 0x3c5aa8, 0.9), 1.9, 2.4, -3.08, BED.bg); box(0.07, 1.9, 0.08, M(0x10141d), 1.9, 2.4, -3.05, BED.bg); box(1.7, 0.07, 0.08, M(0x10141d), 1.9, 2.4, -3.05, BED.bg);

        for (let i = 0; i < 14; i++) box(0.025, 0.025, 0.01, M(0xffffff, 0xffffff, 1.2), 1.2 + rnd() * 1.4, 1.6 + rnd() * 1.5, -3.02, BED.bg);
