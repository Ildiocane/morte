<!doctype html>
<html lang="it" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: Saira; src: url(assets/fonts/saira-900-italic.woff2) format("woff2"); font-weight: 900; font-style: italic; }
      @font-face { font-family: Saira; src: url(assets/fonts/saira-800-italic.woff2) format("woff2"); font-weight: 800; font-style: italic; }
      @font-face { font-family: Saira; src: url(assets/fonts/saira-600-italic.woff2) format("woff2"); font-weight: 600; font-style: italic; }
      @font-face { font-family: Saira; src: url(assets/fonts/saira-900-normal.woff2) format("woff2"); font-weight: 900; font-style: normal; }
      @font-face { font-family: Saira; src: url(assets/fonts/saira-800-normal.woff2) format("woff2"); font-weight: 800; font-style: normal; }
      @font-face { font-family: Saira; src: url(assets/fonts/saira-600-normal.woff2) format("woff2"); font-weight: 600; font-style: normal; }
      :root { --bg:#0b0b0d; --panel:#16161a; --line:rgba(255,255,255,0.09); --text:#f4f4f5; --muted:#a1a1aa; --red:#c0241e; --red2:#ef4b40; --grey:#c2c2c2;
        --green:#22c55e; --green2:#4ade80; --amber:#f5b31b; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; font-family:Inter, ui-sans-serif, system-ui, sans-serif; color:var(--text); background:var(--bg); }

      /* b-roll */
      .bw { position:absolute; inset:0; overflow:hidden; }
      .bw video { position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; }
      .bw.flip video { transform:scaleX(-1); }

      /* full-screen graphics */
      .fs { position:absolute; inset:0; overflow:hidden; }
      #bgl { position:absolute; inset:0; background:radial-gradient(ellipse 85% 75% at 50% 42%, #17171c 0%, #0b0b0d 72%); }
      #bgl .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.032) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.032) 1px, transparent 1px);
        background-size:80px 80px; -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%, #000 25%, transparent 100%); }
      #bgl .stripes { position:absolute; left:-30px; top:58px; width:330px; height:22px; background:repeating-linear-gradient(105deg, rgba(255,255,255,0.10) 0 9px, transparent 9px 24px); }
      .wrap { position:absolute; left:150px; right:150px; top:110px; height:760px; display:flex; flex-direction:column; justify-content:center; }
      .center { align-items:center; text-align:center; }
      .row { display:flex; gap:28px; align-items:center; }
      .col { display:flex; flex-direction:column; gap:22px; }
      .kick { font:italic 800 30px/1 Saira, sans-serif; color:var(--red2); letter-spacing:0.09em; text-transform:uppercase; }
      .h1 { font:italic 900 124px/0.94 Saira, sans-serif; text-transform:uppercase; letter-spacing:-0.005em; }
      .h2 { font:italic 900 82px/1 Saira, sans-serif; text-transform:uppercase; }
      .h3 { font:italic 800 46px/1.05 Saira, sans-serif; text-transform:uppercase; }
      .h4 { font:italic 800 34px/1.1 Saira, sans-serif; text-transform:uppercase; letter-spacing:0.02em; }
      .body { font:600 34px/1.35 Inter, sans-serif; color:var(--muted); }
      .small { font:600 24px/1.3 Inter, sans-serif; color:var(--muted); }
      .red { color:var(--red2); } .green { color:var(--green2); } .amber { color:var(--amber); } .mut { color:var(--muted); }
      .card { position:relative; background:linear-gradient(180deg, #19191e, #121216); border:1px solid var(--line); border-radius:28px; padding:34px 38px; box-shadow:0 30px 60px rgba(0,0,0,0.45); }
      .card.acc::before { content:""; position:absolute; left:0; top:26px; bottom:26px; width:6px; border-radius:0 6px 6px 0; background:var(--red); }
      .card.g::before { background:var(--green); } .card.a::before { background:var(--amber); }
      .chip { display:inline-flex; align-items:center; gap:12px; padding:13px 24px; border-radius:999px; font:700 29px/1 Inter, sans-serif; background:#212127; color:#fff; border:1px solid var(--line); white-space:nowrap; }
      .chip.g { background:rgba(34,197,94,0.13); color:var(--green2); border-color:rgba(34,197,94,0.35); }
      .chip.r { background:rgba(192,36,30,0.16); color:#ff7068; border-color:rgba(239,75,64,0.42); }
      .chip.a { background:rgba(245,179,27,0.13); color:var(--amber); border-color:rgba(245,179,27,0.38); }
      .chip.w { background:#f4f4f5; color:#0b0b0d; }
      .mark { position:relative; display:inline-block; isolation:isolate; padding:0 6px; }
      .mark > i { position:absolute; left:-4px; right:-4px; bottom:6%; height:40%; background:var(--red); z-index:-1; transform:skewX(-12deg) scaleX(0); transform-origin:0 50%; }
      .strk { position:relative; display:inline-block; }
      .strk > i { position:absolute; left:-10px; right:-10px; top:50%; height:8px; margin-top:-4px; background:var(--red2); transform:scaleX(0); transform-origin:0 50%; border-radius:4px; }
      .stamp { display:inline-block; border:8px solid var(--red2); color:var(--red2); font:italic 900 70px/1 Saira, sans-serif; padding:12px 30px 8px; border-radius:16px; transform:rotate(-5deg); text-transform:uppercase; background:rgba(11,11,13,0.6); }
      .stamp.g { border-color:var(--green2); color:var(--green2); }
      .num { font:italic 900 64px/1 Saira, sans-serif; color:var(--red2); }
      .ico { display:inline-flex; align-items:center; justify-content:center; flex:none; }
      .ico svg { display:block; }
      .box { width:64px; height:64px; border-radius:12px; background:#26262c; border:1px solid var(--line); }
      .box.on { background:var(--red); border-color:#ff6b61; }
      .box.w { background:#e9e9ec; }
      .bar { position:relative; border-radius:14px 14px 4px 4px; transform-origin:50% 100%; }
      .neq { font:italic 900 110px/1 Saira, sans-serif; color:var(--red2); }
      .arrow { font:900 54px/1 Inter, sans-serif; color:var(--muted); }
      .lbpill { display:inline-flex; align-items:center; gap:14px; background:var(--grey); border-radius:999px; padding:10px 30px 10px 22px; }
      .lbpill b { font:italic 900 56px/1 Inter, sans-serif; color:#0b0b0b; letter-spacing:-0.02em; }
      table.tb { border-collapse:separate; border-spacing:0 12px; font:700 34px/1 Inter, sans-serif; }
      table.tb td { padding:20px 30px; background:#17171c; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
      table.tb td:first-child { border-left:1px solid var(--line); border-radius:18px 0 0 18px; }
      table.tb td:last-child { border-right:1px solid var(--line); border-radius:0 18px 18px 0; }
      table.tb th { font:italic 800 26px/1 Saira, sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; text-align:left; padding:0 30px 4px; }

      /* pop-ups over b-roll */
      .pop { position:absolute; inset:0; pointer-events:none; }
      .pop .pc { position:absolute; width:640px; background:rgba(14,14,17,0.9); border:1px solid rgba(255,255,255,0.1); border-radius:26px; padding:30px 34px; box-shadow:0 26px 60px rgba(0,0,0,0.55); }
      .pop .pc::before { content:""; position:absolute; left:0; top:24px; bottom:24px; width:6px; border-radius:0 6px 6px 0; background:var(--red); }
      .pop.right .pc { right:90px; top:130px; } .pop.left .pc { left:90px; top:130px; } .pop.low .pc { left:90px; top:560px; } .pop.lowr .pc { right:90px; top:560px; }
      .pop .pt { font:italic 800 36px/1.05 Saira, sans-serif; text-transform:uppercase; margin-bottom:14px; }
      .pop .pl { font:600 29px/1.32 Inter, sans-serif; color:#d4d4d8; display:flex; gap:14px; align-items:flex-start; margin-top:10px; }
      .pop .pl .d { width:10px; height:10px; border-radius:50%; background:var(--red2); margin-top:12px; flex:none; }
      .pop .bubble { position:absolute; width:auto; left:50%; top:150px; transform:translateX(-50%); background:#f4f4f5; color:#0b0b0d; font:italic 900 64px/1 Saira, sans-serif; padding:26px 46px 22px; border-radius:40px; text-transform:uppercase; box-shadow:0 26px 60px rgba(0,0,0,0.5); white-space:nowrap; }
      .pop .bubble::before { display:none; }
      .pop .bubble i { position:absolute; width:26px; height:26px; background:#f4f4f5; border-radius:50%; left:46%; bottom:-38px; }
      .pop .bubble i + i { width:14px; height:14px; left:43%; bottom:-62px; }

      /* hud */
      #hud { position:absolute; inset:0; pointer-events:none; }
      #capgrad { position:absolute; left:0; right:0; bottom:0; height:280px; background:linear-gradient(to top, rgba(0,0,0,0.62), rgba(0,0,0,0)); }
      .chap { position:absolute; left:56px; top:46px; display:flex; align-items:center; gap:16px; opacity:0; }
      .chap .lbm { display:inline-flex; align-items:center; gap:8px; background:var(--grey); border-radius:999px; padding:6px 16px 6px 12px; }
      .chap .lbm b { font:italic 900 26px/1 Inter, sans-serif; color:#0b0b0b; }
      .chapnum { font:italic 900 30px/1 Saira, sans-serif; color:var(--red2); }
      .chaptxt { font:italic 800 26px/1 Saira, sans-serif; color:#fff; text-transform:uppercase; letter-spacing:0.08em; text-shadow:0 2px 10px rgba(0,0,0,0.7); }
      #bug { position:absolute; right:52px; top:40px; width:190px; opacity:0.85; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }
      #prog { position:absolute; left:0; right:0; bottom:0; height:6px; display:flex; gap:4px; background:rgba(0,0,0,0.35); }
      #prog i { position:relative; height:100%; background:rgba(255,255,255,0.14); }
      #prog b { position:absolute; inset:0; background:var(--red2); transform-origin:0 50%; transform:scaleX(0); }
      #caps { position:absolute; left:160px; right:160px; bottom:62px; height:120px; }
      .cap { position:absolute; left:0; right:0; bottom:0; text-align:center; font:700 46px/1.22 Inter, sans-serif; color:#fff; opacity:0;
        text-shadow:0 0 3px rgba(0,0,0,0.95), 0 3px 10px rgba(0,0,0,0.85), 0 8px 26px rgba(0,0,0,0.55); }
      #fadeblack { position:absolute; inset:0; background:#000; opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1920" data-height="1080">
      <div id="bgl" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"><div class="grid"></div><div class="stripes"></div></div>
      __BODY__
      <div id="hud" class="clip" data-start="0" data-duration="__DUR__" data-track-index="3">
        <div id="capgrad"></div>
        __CHAPS__
        <img id="bug" src="assets/img/nexus-dark.png" alt="NEXUS Private Gym" />
        <div id="prog">__SEGS__</div>
        <div id="caps">
        __CAPS__
        </div>
        <div id="fadeblack"></div>
      </div>
      __AUDIO__
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      __ANIMS__
      __CHAP__
      __PROG__
      __CAPJS__
      tl.fromTo("#fadeblack", { opacity: 1 }, { opacity: 0, duration: 0.5 }, 0);
      tl.to("#fadeblack", { opacity: 1, duration: 1.2 }, __DUR__ - 1.2);
      tl.set({}, {}, __DUR__);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
